# /etc/wireguard/wg0.conf — уязвимый туннель: MTU 1500 даёт фрагментацию
# и «залипание» TLS/SSH-сессий (чёрные дыры PMTUD).
[Interface]
Address = 10.99.0.1/24
ListenPort = 51820
PrivateKey = <REDACTED>
MTU = 1500

[Peer]
PublicKey = <PEER_PUBLIC_KEY>
AllowedIPs = 10.99.0.0/24
Endpoint = 203.0.113.10:51820
