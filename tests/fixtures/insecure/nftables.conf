#!/usr/sbin/nft -f
# Уязвимый узел: типовой «плоский» файрвол после установки пакета nftables.
# Используется как негативная фикстура в тестах TopoGuard.

flush ruleset

table inet filter {
    set allowed_admin {
        type ipv4_addr
        flags interval
        # elements намеренно не заданы: набор пуст -> dangling_set
    }

    chain input {
        type filter hook input priority filter; policy accept;

        # SSH открыт всему Интернету и без rate-limit
        tcp dport 22 accept

        # Прикладные порты открыты
        tcp dport { 80, 443 } accept

        # PostgreSQL выставлен наружу явным правилом
        ip saddr 0.0.0.0/0 tcp dport 5432 accept

        # Ссылка на пустой набор адресов: правило не фильтрует ничего
        ip saddr @allowed_admin tcp dport 9090 accept

        ip protocol icmp accept
    }

    chain forward {
        type filter hook forward priority filter; policy accept;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
