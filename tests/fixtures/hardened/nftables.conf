#!/usr/sbin/nft -f
# Эталонный узел после применения патча харденинга TopoGuard.
# Используется как позитивная фикстура: все пять инвариантов выполнены.

flush ruleset

table inet filter {
    set admin_bastion {
        type ipv4_addr
        elements = { 10.30.1.0/24 }
    }

    set ssh_rate {
        type ipv4_addr
        flags dynamic, timeout
        timeout 1m
    }

    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        iif "lo" accept
        ip protocol icmp accept

        # SSH только с ограничением частоты подключений
        tcp dport 22 meter ssh_meter { ip saddr limit rate 3/minute burst 5 packets } accept

        # Прикладные порты публично доступны, но фильтруются policy drop
        tcp dport { 80, 443 } accept

        # СУБД и метрики только из административного бастиона
        ip saddr @admin_bastion tcp dport { 5432, 6379, 9090, 9100 } accept

        # MSS Clamping для туннеля WireGuard
        tcp flags syn tcp option maxseg size set rt mtu
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain DOCKER-USER {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ip saddr @admin_bastion accept
    }
}
