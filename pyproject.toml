[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b3-hardening-copilot"
version = "0.1.0"
description = "Автономный помощник по укреплению безопасности систем Linux и NixOS — IaC TopoGuard, OpenSCAP/Lynis, дерево Меркла в osquery, соответствие стандартам CIS / требованиям ФСТЭК (приказы № 21, № 117)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Кожемякин Дмитрий Николаевич", email = "d78384526@gmail.com" },
    { name = "Вебер Александр Александрович", email = "a_veber.yanao@mail.ru" },
]
keywords = ["security", "hardening", "nixos", "nftables", "fstec", "openscap", "osquery"]

dependencies = [
    # Эталонная реализация ГОСТ Р 34.11-2012 («Стрибог-256»).
    # Самописная криптография в журнале ревизий намеренно не используется.
    "gostcrypto>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider -p no:tmpdir"
filterwarnings = ["error::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
